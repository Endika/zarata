version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    groups:
      security-npm:
        applies-to: security-updates
        patterns:
          - "*"
      vitest-suite:
        applies-to: version-updates
        patterns:
          - 'vitest'
          - '@vitest/*'
      typescript-eslint:
        applies-to: version-updates
        patterns:
          - '@typescript-eslint/*'
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(ci)'
    groups:
      security-actions:
        applies-to: security-updates
        patterns:
          - "*"
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
